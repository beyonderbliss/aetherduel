name: AetherDuel Android APK (Startup-ready)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherduel-android-startup-ready-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout clean AetherDuel source
        uses: actions/checkout@v5
        with:
          path: aetherduel-source

      - name: Checkout pinned Android wrapper and submodules
        uses: actions/checkout@v5
        with:
          repository: edo9300/edopro-android
          ref: 36517642ce8151d9e6e5fb1acb801dfa7a8ef1f5
          path: android-wrapper
          submodules: recursive

      - name: Overlay clean AetherDuel source into Android wrapper
        run: |
          set -euo pipefail
          test -d android-wrapper/deps/edopro/ocgcore
          rsync -a --delete \
            --exclude='.git' \
            --exclude='ocgcore/' \
            --exclude='.github/' \
            "aetherduel-source/" android-wrapper/deps/edopro/
          test -f android-wrapper/deps/edopro/gframe/game.cpp
          echo "AetherDuel source revision: $GITHUB_SHA"
          echo "AetherDuel source revision staged for Android build."

      - name: Remove legacy Android maximum aspect ratio cap
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest = Path("src/main/AndroidManifest.xml")
          text = manifest.read_text()
          pattern = r'\s*<meta-data\s+android:name="android\.max_aspect"\s+android:value="2\.1"\s*/>'
          updated, count = re.subn(pattern, "", text, count=1)
          assert count == 1, "Expected exactly one legacy android.max_aspect=2.1 entry"
          assert "android.max_aspect" not in updated, "Legacy aspect-ratio cap remains"
          manifest.write_text(updated)
          print("Removed legacy 2.1 maximum aspect ratio cap.")
          PY
          ! grep -q 'android.max_aspect' src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Apply WindBot-free diagnostic isolation
        working-directory: android-wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          gradle = Path("build.gradle")
          text = gradle.read_text()
          dependency = '\timplementation(files("libs/libWindbot.aar"))\n'
          assert text.count(dependency) == 1, "Expected exactly one WindBot AAR dependency"
          gradle.write_text(text.replace(dependency, ""))

          main = Path("src/main/java/io.github.edo9300.edopro/MainActivity.java")
          text = main.read_text()
          text = text.replace("import libwindbot.windbot.WindBot;\n", "")
          old = """\t\tvar use_windbot = true;
          \t\tif (Build.VERSION.SDK_INT <= Build.VERSION_CODES.ICE_CREAM_SANDWICH_MR1) {
          \t\t\tuse_windbot = false;
          \t\t} else {
          \t\t\ttry {
          \t\t\t\t/*
          \t\t\t\t * windbot loading might fail, for whatever reason,
          \t\t\t\t * disable it if that's the case
          \t\t\t\t */
          \t\t\t\tWindBot.initAndroid(working_directory + "/WindBot");
          \t\t\t} catch (Exception e) {
          \t\t\t\tuse_windbot = false;
          \t\t\t}
          \t\t}
          """
          assert text.count(old) == 1, "Could not uniquely locate WindBot initialization"
          text = text.replace(old, "\t\tvar use_windbot = false;\n")
          assert "WindBot" not in text, "Unexpected WindBot reference remains in MainActivity"
          main.write_text(text)

          native = Path("src/main/java/io.github.edo9300.edopro/EpNativeActivity.java")
          text = native.read_text()
          fullscreen_pattern = (
              r'\t@SuppressWarnings\("ObsoleteSdkInt"\)\n'
              r'\tprivate void makeFullScreen\(\) \{.*?\n\t\}'
          )
          fullscreen_replacement = """\t@SuppressWarnings("ObsoleteSdkInt")
          \tprivate void makeFullScreen() {
          \t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
          \t\t\tandroid.view.WindowInsetsController controller = getWindow().getInsetsController();
          \t\t\tif (controller != null) {
          \t\t\t\tcontroller.setSystemBarsBehavior(
          \t\t\t\t\t\tandroid.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
          \t\t\t\tcontroller.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t}
          \t\t} else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
          \t\t\tgetWindow().getDecorView().setSystemUiVisibility(
          \t\t\t\t\tandroid.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
          \t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
          \t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
          \t\t}
          \t}
          """
          text, fullscreen_count = re.subn(
              fullscreen_pattern, fullscreen_replacement, text, count=1, flags=re.S
          )
          assert fullscreen_count == 1, "Could not replace legacy fullscreen method"
          text = text.replace("import libwindbot.windbot.WindBot;\n", "")
          for action, method in [
              ("RUN_WINDBOT", "runAndroid"),
              ("ATTACH_WINDBOT_DATABASE", "addDatabase"),
          ]:
              pattern = (
                  r'\n\t\t\t\tcase "' + action + r'": \{.*?'
                  + re.escape("WindBot." + method) + r'\(args\);'
                  + r'.*?\n\t\t\t\t\}'
              )
              text, count = re.subn(pattern, "", text, count=1, flags=re.S)
              assert count == 1, "Could not remove " + action + " receiver"
          assert "WindBot." not in text, "WindBot runtime call remains in EpNativeActivity"
          declaration = "\tpublic static native void putBackKeyEvent();\n"
          anchor = "\tpublic static native void errorDialogReturn();\n"
          assert text.count(anchor) == 1, "Could not locate native callback declarations"
          assert "putBackKeyEvent" not in text, "Back callback already exists"
          text = text.replace(anchor, anchor + declaration)
          input_mode_java = """
\tprivate int deckNamePreviousSystemUiVisibility = -1;
          private boolean deckNameInputModeActive = false;

          \tpublic void setDeckNameInputMode(boolean active) {
          \t\trunOnUiThread(() -> {
          \t\t\tandroid.view.View decor = getWindow().getDecorView();
          \t\t\tdeckNameInputModeActive = active;
          \t\t\tif (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
          \t\t\t\tandroid.view.WindowInsetsController controller = getWindow().getInsetsController();
          \t\t\t\tif (controller != null) {
          \t\t\t\t\tcontroller.setSystemBarsBehavior(
          \t\t\t\t\t\t\tandroid.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
          \t\t\t\t\tcontroller.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t\t}
          \t\t\t\t// Reapply after the IME request so its inset transition cannot leave
          \t\t\t\t// the navigation bar visible beside the split keyboard.
          \t\t\t\tif (active) {
          \t\t\t\t\tdecor.post(() -> {
          \t\t\t\t\t\tif (deckNameInputModeActive) {
          \t\t\t\t\t\t\tandroid.view.WindowInsetsController current = getWindow().getInsetsController();
          \t\t\t\t\t\t\tif (current != null)
          \t\t\t\t\t\t\t\tcurrent.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t\t\t\t}
          \t\t\t\t\t});
          \t\t\t\t}
          \t\t\t} else if (active) {
          \t\t\t\tif (deckNamePreviousSystemUiVisibility < 0)
          \t\t\t\t\tdeckNamePreviousSystemUiVisibility = decor.getSystemUiVisibility();
          \t\t\t\tdecor.setSystemUiVisibility(
          \t\t\t\t\t\tdeckNamePreviousSystemUiVisibility
          \t\t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
          \t\t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
          \t\t\t} else if (deckNamePreviousSystemUiVisibility >= 0) {
          \t\t\t\tdecor.setSystemUiVisibility(deckNamePreviousSystemUiVisibility);
          \t\t\t\tdeckNamePreviousSystemUiVisibility = -1;
          \t\t\t}
          \t\t});
          \t}
          """

          old_back = """\t@Override
          \tpublic boolean onKeyDown(int keyCode, KeyEvent event) {
          \t\tif (keyCode == KeyEvent.KEYCODE_BACK) {
          \t\t\tif ((event.getSource() & InputDevice.SOURCE_MOUSE) != InputDevice.SOURCE_MOUSE)
          \t\t\t\treturn true;
          \t\t}
          \t\treturn super.onKeyDown(keyCode, event);
          \t}
          """
          new_back = """\t@Override
          \tpublic boolean onKeyDown(int keyCode, KeyEvent event) {
          \t\tif (keyCode == KeyEvent.KEYCODE_BACK &&
          \t\t\t\t(event.getSource() & InputDevice.SOURCE_MOUSE) != InputDevice.SOURCE_MOUSE) {
          \t\t\tputBackKeyEvent();
          \t\t\treturn true;
          \t\t}
          \t\treturn super.onKeyDown(keyCode, event);
          \t}

          \t@Override
          \tpublic void onBackPressed() {
          \t\tputBackKeyEvent();
          \t}
          """
          assert text.count(old_back) == 1, "Could not uniquely locate Android Back handler"
          text = text.replace(old_back, input_mode_java + "\n" + new_back)

          oncreate_anchor = "\t\tsuper.onCreate(savedInstanceState);\n"
          assert text.count(oncreate_anchor) == 1, "Could not locate Activity onCreate"
          oncreate_back = (
              oncreate_anchor
              + "\t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {\n"
              + "\t\t\tgetOnBackInvokedDispatcher().registerOnBackInvokedCallback(\n"
              + "\t\t\t\t\tandroid.window.OnBackInvokedDispatcher.PRIORITY_OVERLAY,\n"
              + "\t\t\t\t\t() -> putBackKeyEvent());\n"
              + "\t\t}\n"
          )
          text = text.replace(oncreate_anchor, oncreate_back)
          old_show_dialog = """
\tpublic void showDialog(String current) {
          \t\tvar intent = new Intent();
          \t\tintent.putExtra("current", current);
          \t\tintent.setAction("INPUT_TEXT");
          \t\tLocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          \t}"""
          new_show_dialog = """
\tpublic void showDialog(String current, boolean deckNameInput) {
          \t\tvar intent = new Intent();
          \t\tintent.putExtra("current", current);
          \t\tintent.putExtra("deckNameInput", deckNameInput);
          \t\tintent.setAction("INPUT_TEXT");
          \t\tLocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          \t}"""
          assert text.count(old_show_dialog) == 1, "Could not locate showDialog method"
          text = text.replace(old_show_dialog, new_show_dialog)
          old_text_entry_receiver = "new TextEntry().Show(EpNativeActivity.this, intent.getStringExtra(\"current\"));"
          new_text_entry_receiver = """new TextEntry().Show(EpNativeActivity.this, intent.getStringExtra("current"),
          \t\t\t\t\t\t\tintent.getBooleanExtra("deckNameInput", false));"""
          assert text.count(old_text_entry_receiver) == 1, "Could not locate TextEntry receiver"
          text = text.replace(old_text_entry_receiver, new_text_entry_receiver)
          native.write_text(text)

          # Replace the Android IME dialog with AetherDuel's split in-app keyboard.
          textentry = Path("src/main/java/io.github.edo9300.edopro/TextEntry.java")
          java_source = r'''package io.github.edo9300.edopro;

          import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Space;
          import android.widget.TextView;

          public class TextEntry {
              private AlertDialog mTextInputDialog;
              private Context context;
              private StringBuilder value;
              private TextView preview;
              private LinearLayout keyboardRows;
              private boolean deckNameInput;
              private boolean shifted;
              private boolean symbols;
              private boolean finished;

              public void Show(Context context, String current, boolean deckNameInput) {
                  this.context = context;
                  this.deckNameInput = deckNameInput;
                  this.value = new StringBuilder(current == null ? "" : current);
                  this.shifted = false;
                  this.symbols = false;
                  this.finished = false;

                  LinearLayout root = new LinearLayout(context);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(8), dp(8), dp(8), dp(10));
                  GradientDrawable panel = new GradientDrawable();
                  panel.setColor(Color.rgb(24, 27, 34));
                  panel.setCornerRadius(dp(12));
                  root.setBackground(panel);

                  preview = new TextView(context);
                  preview.setTextColor(Color.WHITE);
                  preview.setTextSize(16);
                  preview.setSingleLine(true);
                  preview.setHorizontallyScrolling(true);
                  preview.setGravity(Gravity.CENTER);
                  preview.setPadding(dp(12), 0, dp(12), 0);
                  preview.setBackground(makeKeyBackground(false));
                  LinearLayout.LayoutParams previewParams =
                          new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(38));
                  previewParams.setMargins(dp(2), dp(2), dp(2), dp(7));
                  root.addView(preview, previewParams);

                  keyboardRows = new LinearLayout(context);
                  keyboardRows.setOrientation(LinearLayout.VERTICAL);
                  root.addView(keyboardRows, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  updatePreview();
                  rebuildKeyboard();

                  mTextInputDialog = new AlertDialog.Builder(context).setView(root).create();
                  mTextInputDialog.setCanceledOnTouchOutside(false);
                  mTextInputDialog.setOnCancelListener(dialog -> cancelInput());
                  mTextInputDialog.show();

                  Window window = mTextInputDialog.getWindow();
                  if (window != null) {
                      window.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      window.setLayout(WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.WRAP_CONTENT);
                      window.setGravity(Gravity.BOTTOM);
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      applyImmersiveNavigation(window);
                  }
              }

              private void rebuildKeyboard() {
                  keyboardRows.removeAllViews();
                  if (!symbols) {
                      addSplitRow(new String[]{"q", "w", "e", "r", "t"},
                              new String[]{"y", "u", "i", "o", "p"});
                      addSplitRow(new String[]{"a", "s", "d", "f", "g"},
                              new String[]{"h", "j", "k", "l"});
                      addSplitRow(new String[]{"SHIFT", "z", "x", "c", "v"},
                              new String[]{"b", "n", "m", "⌫"});
                  } else {
                      addSplitRow(new String[]{"1", "2", "3", "4", "5"},
                              new String[]{"6", "7", "8", "9", "0"});
                      addSplitRow(new String[]{"@", "#", "$", "%", "&"},
                              new String[]{"-", "+", "(", ")", "/"});
                      addSplitRow(new String[]{"=", "*", "'", "\"", ":"},
                              new String[]{";", "!", "?", "⌫"});
                  }
                  addSplitRow(new String[]{"?123", ",", "SPACE"},
                          new String[]{".", "CANCEL", "DONE"});
              }

              private void addSplitRow(String[] leftKeys, String[] rightKeys) {
                  LinearLayout row = new LinearLayout(context);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout left = new LinearLayout(context);
                  left.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout right = new LinearLayout(context);
                  right.setOrientation(LinearLayout.HORIZONTAL);

                  row.addView(left, new LinearLayout.LayoutParams(0, dp(45), 1f));
                  row.addView(new Space(context), new LinearLayout.LayoutParams(dp(62), dp(45)));
                  row.addView(right, new LinearLayout.LayoutParams(0, dp(45), 1f));

                  for (String key : leftKeys)
                      addKey(left, key);
                  for (String key : rightKeys)
                      addKey(right, key);

                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(45));
                  rowParams.setMargins(0, dp(2), 0, dp(2));
                  keyboardRows.addView(row, rowParams);
              }

              private void addKey(LinearLayout group, String key) {
                  Button button = new Button(context);
                  button.setText(getKeyLabel(key));
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(key.length() > 1 ? 11 : 15);
                  button.setAllCaps(false);
                  button.setMinWidth(0);
                  button.setMinimumWidth(0);
                  button.setPadding(dp(2), 0, dp(2), 0);
                  button.setBackground(makeKeyBackground(true));
                  button.setOnClickListener(view -> handleKey(key));

                  float weight = "SPACE".equals(key) ? 2f : 1f;
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.MATCH_PARENT, weight);
                  params.setMargins(dp(2), 0, dp(2), 0);
                  group.addView(button, params);
              }

              private String getKeyLabel(String key) {
                  if ("SHIFT".equals(key))
                      return "⇧";
                  if ("SPACE".equals(key))
                      return "Space";
                  if ("?123".equals(key))
                      return symbols ? "ABC" : "?123";
                  if ("CANCEL".equals(key))
                      return "Cancel";
                  if ("DONE".equals(key))
                      return "Enter";
                  if ("⌫".equals(key))
                      return "⌫";
                  if (key.length() == 1 && Character.isLetter(key.charAt(0)))
                      return shifted ? key.toUpperCase() : key;
                  return key;
              }

              private void handleKey(String key) {
                  if (finished)
                      return;
                  if ("DONE".equals(key)) {
                      pushResult(value.toString(), true);
                  } else if ("CANCEL".equals(key)) {
                      cancelInput();
                  } else if ("SHIFT".equals(key)) {
                      shifted = !shifted;
                      rebuildKeyboard();
                  } else if ("?123".equals(key)) {
                      symbols = !symbols;
                      rebuildKeyboard();
                  } else if ("SPACE".equals(key)) {
                      value.append(' ');
                      updatePreview();
                  } else if ("⌫".equals(key)) {
                      if (value.length() > 0) {
                          int start = Character.offsetByCodePoints(value, value.length(), -1);
                          value.delete(start, value.length());
                          updatePreview();
                      }
                  } else {
                      value.append(shifted ? key.toUpperCase() : key);
                      if (shifted) {
                          shifted = false;
                          rebuildKeyboard();
                      }
                      updatePreview();
                  }
              }

              private void updatePreview() {
                  preview.setText(value.length() == 0 ? " " : value.toString());
              }

              private void pushResult(String text, boolean sendEnter) {
                  if (finished)
                      return;
                  finished = true;
                  EpNativeActivity.putMessageBoxResult(text, sendEnter);
                  if (mTextInputDialog != null)
                      mTextInputDialog.dismiss();
              }

              private void cancelInput() {
                  if (finished)
                      return;
                  finished = true;
                  if (deckNameInput) {
                      EpNativeActivity.putBackKeyEvent();
                  } else {
                      EpNativeActivity.putMessageBoxResult(value.toString(), false);
                  }
                  if (mTextInputDialog != null)
                      mTextInputDialog.dismiss();
              }

              private GradientDrawable makeKeyBackground(boolean key) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(key ? Color.rgb(54, 59, 69) : Color.rgb(38, 43, 52));
                  drawable.setCornerRadius(dp(key ? 6 : 7));
                  drawable.setStroke(dp(1), Color.rgb(75, 82, 94));
                  return drawable;
              }

              private int dp(float value) {
                  return (int) (value * context.getResources().getDisplayMetrics().density + 0.5f);
              }

              private void applyImmersiveNavigation(Window window) {
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      android.view.WindowInsetsController controller = window.getInsetsController();
                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                                  android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          controller.hide(android.view.WindowInsets.Type.navigationBars());
                      }
                  } else if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }
          }'''
          # Apply shared browser/Android keyboard geometry; all values are Android dp.
          layout = json.loads(Path("deps/edopro/tools/web-layout-lab/layout-spec/keyboard.json").read_text())
          panel, preview_spec, keys = layout["panel"], layout["preview"], layout["keys"]
          replacements = {
              "root.setPadding(dp(8), dp(8), dp(8), dp(10));": f"root.setPadding(dp({panel['padding']['left']}), dp({panel['padding']['top']}), dp({panel['padding']['right']}), dp({panel['padding']['bottom']}));",
              "panel.setColor(Color.rgb(24, 27, 34));": f'panel.setColor(Color.parseColor("{panel["color"]}"));',
              "panel.setCornerRadius(dp(12));": f"panel.setCornerRadius(dp({panel['radius']}));",
              "new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(38));": f"new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp({preview_spec['height']}));",
              "previewParams.setMargins(dp(2), dp(2), dp(2), dp(7));": f"previewParams.setMargins(dp({preview_spec['margin']['left']}), dp({preview_spec['margin']['top']}), dp({preview_spec['margin']['right']}), dp({preview_spec['margin']['bottom']}));",
              "preview.setPadding(dp(12), 0, dp(12), 0);": f"preview.setPadding(dp({preview_spec['paddingX']}), 0, dp({preview_spec['paddingX']}), 0);",
              "new LinearLayout.LayoutParams(0, dp(45), 1f)": f"new LinearLayout.LayoutParams(0, dp({keys['rowHeight']}), 1f)",
              "LinearLayout.LayoutParams.MATCH_PARENT, dp(45));": f"LinearLayout.LayoutParams.MATCH_PARENT, dp({keys['rowHeight']}));",
              "rowParams.setMargins(0, dp(2), 0, dp(2));": f"rowParams.setMargins(0, dp({keys['rowGap']}), 0, dp({keys['rowGap']}));",
              "params.setMargins(dp(2), 0, dp(2), 0);": f"params.setMargins(dp({keys['horizontalMargin']}), 0, dp({keys['horizontalMargin']}), 0);",
              "drawable.setColor(key ? Color.rgb(54, 59, 69) : Color.rgb(38, 43, 52));": f'drawable.setColor(Color.parseColor(key ? "{keys["color"]}" : "{preview_spec["color"]}"));',
              "drawable.setCornerRadius(dp(key ? 6 : 7));": f"drawable.setCornerRadius(dp(key ? {keys['radius']} : {preview_spec['radius']}));",
              "drawable.setStroke(dp(1), Color.rgb(75, 82, 94));": f'drawable.setStroke(dp(1), Color.parseColor("{keys["stroke"]}"));',
              "button.setTextColor(Color.WHITE);": f'button.setTextColor(Color.parseColor("{keys["textColor"]}"));',
              "button.setTextSize(key.length() > 1 ? 11 : 15);": f"button.setTextSize(key.length() > 1 ? {keys['actionTextSize']} : {keys['letterTextSize']});"
          }
          for old_value, new_value in replacements.items():
              assert java_source.count(old_value) >= 1, "Could not apply keyboard layout value: " + old_value
              java_source = java_source.replace(old_value, new_value)
          # Generate native rows as independent left/right groups. The bottom SPACE key
          # is the only intentional bridge across the center spacer.
          layout = json.loads(Path("deps/edopro/tools/web-layout-lab/layout-spec/keyboard.json").read_text())
          keys = layout["keys"]
          center_gap = int(keys["centerGap"])
          key_margin = int(keys["horizontalMargin"])
          row_height = int(keys["rowHeight"])
          row_gap = int(keys["rowGap"])
          space_weight = float(keys["spaceWeight"])
          assert center_gap > 0 and space_weight > 0, "Invalid split keyboard geometry"

          def java_array(items):
              return ", ".join("new String[]{" + ", ".join(json.dumps(str(v)) for v in item) + "}" for item in items)

          def side_items(placements, row_index, side):
              items = []
              for key, data in placements.items():
                  if data["y"] != row_index or key == "SPACE":
                      continue
                  x, width = float(data["x"]), float(data["w"])
                  if side == "left" and x < 10 and x + width <= 10:
                      local_x = x
                  elif side == "right" and x >= 14 and x + width <= 24:
                      local_x = x - 14
                  else:
                      continue
                  display_key = data.get("key", key)
                  left_margin = key_margin
                  right_margin = key_margin * 3 if display_key == "DONE" else key_margin
                  items.append([display_key, local_x, width, left_margin, right_margin])
              items.sort(key=lambda item: float(item[1]))
              return items

          generated = [
              "    private void rebuildKeyboard() {",
              "        keyboardRows.removeAllViews();"
          ]
          for layout_name, condition in (("letters", "if (!symbols) {"), ("symbols", "else {")):
              generated.append("        " + condition)
              placements = layout["buttons"][layout_name]
              for row_index in range(3):
                  left = side_items(placements, row_index, "left")
                  right = side_items(placements, row_index, "right")
                  generated.append(
                      "            addSplitRow(" + str(row_index) + ", new String[][]{" +
                      java_array(left) + "}, new String[][]{" + java_array(right) + "});"
                  )
              generated.append("            addBottomRow();")
              generated.append("        }")
          generated.append("    }")
          generated.extend([
              "",
              "    private void addSplitRow(int rowIndex, String[][] leftItems, String[][] rightItems) {",
              "        LinearLayout row = new LinearLayout(context);",
              "        row.setOrientation(LinearLayout.HORIZONTAL);",
              "        LinearLayout left = new LinearLayout(context);",
              "        left.setOrientation(LinearLayout.HORIZONTAL);",
              "        LinearLayout right = new LinearLayout(context);",
              "        right.setOrientation(LinearLayout.HORIZONTAL);",
              "        addSplitGroup(left, leftItems, 10f);",
              "        addSplitGroup(right, rightItems, 10f);",
              "        row.addView(left, new LinearLayout.LayoutParams(0, dp(" + str(row_height) + "), 10f));",
              "        row.addView(new Space(context), new LinearLayout.LayoutParams(dp(" + str(center_gap) + "), dp(" + str(row_height) + ")));",
              "        row.addView(right, new LinearLayout.LayoutParams(0, dp(" + str(row_height) + "), 10f));",
              "        addKeyboardRow(row, rowIndex);",
              "    }",
              "",
              "    private void addBottomRow() {",
              "        LinearLayout row = new LinearLayout(context);",
              "        row.setOrientation(LinearLayout.HORIZONTAL);",
              "        LinearLayout left = new LinearLayout(context);",
              "        left.setOrientation(LinearLayout.HORIZONTAL);",
              "        LinearLayout right = new LinearLayout(context);",
              "        right.setOrientation(LinearLayout.HORIZONTAL);",
              "        addSplitGroup(left, new String[][]{",
              "            new String[]{\"CANCEL\", \"0\", \"1.8\", \"" + str(key_margin) + "\", \"" + str(key_margin) + "\"},",
              "            new String[]{\"?123\", \"2\", \"1.8\", \"" + str(key_margin) + "\", \"" + str(key_margin) + "\"},",
              "            new String[]{\",\", \"4\", \"1.8\", \"" + str(key_margin) + "\", \"" + str(key_margin) + "\"}",
              "        }, 6f);",
              "        addSplitGroup(right, new String[][]{",
              "            new String[]{\".\", \"0\", \"1.8\", \"" + str(key_margin) + "\", \"" + str(key_margin) + "\"},",
              "            new String[]{\"DONE\", \"2\", \"3.6\", \"" + str(key_margin) + "\", \"" + str(key_margin * 3) + "\"}",
              "        }, 6f);",
              "        row.addView(left, new LinearLayout.LayoutParams(0, dp(" + str(row_height) + "), 6f));",
              "        addBridgeKey(row, \"SPACE\", " + str(space_weight) + "f, " + str(center_gap) + ", " + str(key_margin) + ");",
              "        row.addView(right, new LinearLayout.LayoutParams(0, dp(" + str(row_height) + "), 6f));",
              "        addKeyboardRow(row, 3);",
              "    }",
              "",
              "    private void addSplitGroup(LinearLayout group, String[][] items, float totalUnits) {",
              "        float cursor = 0f;",
              "        for (String[] item : items) {",
              "            String key = item[0];",
              "            float column = Float.parseFloat(item[1]);",
              "            float span = Float.parseFloat(item[2]);",
              "            int marginLeft = Integer.parseInt(item[3]);",
              "            int marginRight = Integer.parseInt(item[4]);",
              "            if (column > cursor + 0.001f) {",
              "                group.addView(new Space(context), new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, column - cursor));",
              "            }",
              "            addKey(group, key, span, marginLeft, marginRight);",
              "            cursor = column + span;",
              "        }",
              "        if (cursor < totalUnits) {",
              "            group.addView(new Space(context), new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, totalUnits - cursor));",
              "        }",
              "    }",
              "",
              "    private void addKeyboardRow(LinearLayout row, int rowIndex) {",
              "        LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(" + str(row_height) + "));",
              "        rowParams.setMargins(0, rowIndex == 0 ? 0 : dp(" + str(row_gap) + "), 0, 0);",
              "        keyboardRows.addView(row, rowParams);",
              "    }",
              "",
              "    private void addKey(LinearLayout group, String key, float weight, int marginLeft, int marginRight) {",
              "        FrameLayout slot = new FrameLayout(context);",
              "        Button button = createKeyButton(key);",
              "        FrameLayout.LayoutParams buttonParams = new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT);",
              "        buttonParams.setMargins(dp(marginLeft), 0, dp(marginRight), 0);",
              "        slot.addView(button, buttonParams);",
              "        group.addView(slot, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, weight));",
              "    }",
              "",
              "    private void addBridgeKey(LinearLayout row, String key, float weight, int totalFixedWidth, int margin) {",
              "        FrameLayout slot = new FrameLayout(context);",
              "        Button button = createKeyButton(key);",
              "        FrameLayout.LayoutParams buttonParams = new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT);",
              "        buttonParams.setMargins(dp(margin), 0, dp(margin), 0);",
              "        slot.addView(button, buttonParams);",
              "        row.addView(slot, new LinearLayout.LayoutParams(dp(totalFixedWidth), LinearLayout.LayoutParams.MATCH_PARENT, weight));",
              "    }",
              "",
              "    private Button createKeyButton(String key) {",
              "        Button button = new Button(context);",
              "        button.setText(getKeyLabel(key));",
              "        button.setTextColor(Color.parseColor(\"" + keys["textColor"] + "\"));",
              "        button.setTextSize(key.length() > 1 ? " + str(keys["actionTextSize"]) + " : " + str(keys["letterTextSize"]) + ");",
              "        button.setAllCaps(false);",
              "        button.setMinWidth(0);",
              "        button.setMinimumWidth(0);",
              "        button.setPadding(dp(2), 0, dp(2), 0);",
              "        button.setBackground(makeKeyBackground(true));",
              "        button.setOnClickListener(view -> handleKey(key));",
              "        return button;",
              "    }"
          ])
          methods = "\n".join(generated)
          java_source = java_source.replace("import android.widget.Button;", "import android.widget.Button;\\n          import android.widget.FrameLayout;")
          method_start = java_source.index("private void rebuildKeyboard()")
          method_end = java_source.index("private String getKeyLabel", method_start)
          java_source = java_source[:method_start] + methods + "\n\n              private String getKeyLabel" + java_source[method_end + len("private String getKeyLabel"):]
          textentry.write_text(java_source)
          print("Installed grid-positioned keyboard from the shared layout specification.")

          print("WindBot-free Android wrapper prepared with native deck-name Back cancellation.")
          PY
          ! grep -R -nE 'libwindbot|WindBot\.(initAndroid|runAndroid|addDatabase)' build.gradle src/main/java

      - name: Restrict native build to Android ARM64
        working-directory: android-wrapper
        run: |
          sed -i 's/^APP_ABI :=.*/APP_ABI := arm64-v8a/' jni/Application.mk
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'.*/abiFilters 'arm64-v8a'/" build.gradle
          grep -q '^APP_ABI := arm64-v8a$' jni/Application.mk
          grep -q "abiFilters 'arm64-v8a'" build.gradle

      - name: Prepare minimal playable EDOPro data
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          A=src/main/assets/defaults
          mkdir -p "$A/config" "$A/fonts" "$A/textures" "$A/pics" "$A/deck"
          # Package PrimaNyx skin for fresh installs and app updates.
          SKIN_SOURCE="deps/edopro/skin/PrimaNyx/skin.xml"
          test -s "$SKIN_SOURCE"

          mkdir -p \
            "$A/skin/PrimaNyx" \
            "src/main/assets/update/skin/PrimaNyx"

          cp "$SKIN_SOURCE" "$A/skin/PrimaNyx/skin.xml"
          cp "$SKIN_SOURCE" "src/main/assets/update/skin/PrimaNyx/skin.xml"
          test -d deps/edopro/deck
          cp -a deps/edopro/deck/. "$A/deck/"
          test -s "$A/deck/[TEST] Dark Magician.ydk"
          test -s "$A/deck/[TEST] Blue-Eyes.ydk"
          BASE=https://raw.githubusercontent.com/ProjectIgnis/Distribution/master
          curl -fL "$BASE/config/strings.conf" -o "$A/config/strings.conf"
          curl -fL "$BASE/config/system.conf" -o "$A/config/system.conf"
          curl -fL "$BASE/fonts/NotoSansJP-Regular.otf" -o "$A/fonts/NotoSansJP-Regular.otf"
          printf '{"repos":[],"urls":[]}\n' > "$A/config/configs.json"
          printf '{"mappings":[]}\n' > "$A/config/mappings.json"
          for name in cover unknown act attack chain negated number lp lpf mask equip target chaintarget lim ot f1 f2 f3 bg field2 field-transparent2 field3 field-transparent3 field field-transparent field4 field-transparent4 fieldSP2 field-transparentSP2 fieldSP3 field-transparentSP3 fieldSP field-transparentSP fieldSP4 field-transparentSP4 settings; do
            for ext in png jpg; do
              if curl -fsSL "$BASE/textures/$name.$ext" -o "$A/textures/$name.$ext"; then break; fi
            done
            test -s "$A/textures/$name.png" -o -s "$A/textures/$name.jpg"
          done
          # Download the full CDB only as a temporary source; never package it.
          SOURCE_CDB="$RUNNER_TEMP/babel-cards-source.cdb"
          curl -fL https://raw.githubusercontent.com/ProjectIgnis/BabelCDB/master/cards.cdb -o "$SOURCE_CDB"
          test -s "$SOURCE_CDB"
          python3 deps/edopro/tools/prepare-dark-test-cards.py "$SOURCE_CDB" "$A"
          test "$(wc -l < "$A/dark-test-cards.txt")" -eq 41
          test "$(find "$A/pics" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 40
          test -s "$A/cards.cdb"
          test ! -e "$A/babel-cards-source.cdb"
          rm -f "$SOURCE_CDB"
          du -sh "$A"

      - name: Finalize indexed app assets
        working-directory: android-wrapper
        run: bash ci/finalize-assets.sh

      - name: Configure Android SDK paths
        working-directory: android-wrapper
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'ndk.dir=%s/ndk/21.4.7075529\n' "$ANDROID_SDK_ROOT" >> local.properties

      - name: Build native libraries
        working-directory: android-wrapper
        run: |
          export PATH="$ANDROID_SDK_ROOT/ndk/21.4.7075529:$PATH"
          ndk-build

      - name: Set AetherDuel application ID
        working-directory: android-wrapper
        run: |
          sed -i 's/applicationId "io.github.edo9300.edopro"/applicationId "io.github.beyonderbliss.aetherduel"/' build.gradle
          grep -q 'applicationId "io.github.beyonderbliss.aetherduel"' build.gradle

      - name: Apply Android 15 edge-to-edge opt-out for cutout compatibility
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          mkdir -p src/main/res/values-v35 src/main/res/values-v36

          cat > src/main/res/values-v35/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@style/Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowBackground">@drawable/bg</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">never</item>
              </style>
          </resources>
          XML

          cat > src/main/res/values-v36/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@style/Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowBackground">@drawable/bg</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
          </resources>
          XML

          grep -q 'windowOptOutEdgeToEdgeEnforcement' src/main/res/values-v35/styles.xml
          grep -q 'windowLayoutInDisplayCutoutMode.*never' src/main/res/values-v35/styles.xml
          ! grep -q 'windowOptOutEdgeToEdgeEnforcement' src/main/res/values-v36/styles.xml
          ! grep -q 'windowLayoutInDisplayCutoutMode' src/main/res/values-v36/styles.xml
          grep -q 'android:theme="@style/AppTheme"' src/main/AndroidManifest.xml
          echo "API 35: edge-to-edge opt-out enabled; API 36+: opt-out omitted."

      - name: Build debug APK
        working-directory: android-wrapper
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: aetherduel-android-arm64-debug
          path: android-wrapper/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
