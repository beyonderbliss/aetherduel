name: AetherDuel Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
  ANDROID_HOME: ${{ runner.temp }}/android-sdk

jobs:
  build-android:
    name: Build lightweight Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout AetherDuel source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android NDK r21d
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
          key: ${{ runner.os }}-android-ndk-21.4.7075529

      - name: Install Android platform and pinned NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build AetherDuel debug APK
        run: bash scripts/build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherduel-android-debug-${{ github.sha }}
          path: .build/android-wrapper/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aetherduel-android-build-diagnostics-${{ github.sha }}
          path: |
            .build/android-wrapper/build/outputs/logs/
            .build/android-wrapper/.cxx/
          if-no-files-found: ignore
          retention-days: 7
