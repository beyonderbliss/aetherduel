                  drawable.setCornerRadius(dp(key ? 6 : 7));
                  drawable.setStroke(dp(1), Color.rgb(75, 82, 94));
                  return drawable;
              }

              private int dp(float value) {
                  return (int) (value * context.getResources().getDisplayMetrics().density + 0.5f);
              }

