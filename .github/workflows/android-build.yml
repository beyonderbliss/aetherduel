      - name: Restrict native build to Android ARM64
        working-directory: android-wrapper
        run: |
          sed -i 's/^APP_ABI :=.*/APP_ABI := arm64-v8a/' jni/Application.mk
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'.*/abiFilters 'arm64-v8a'/" build.gradle
          grep -q '^APP_ABI := arm64-v8a$' jni/Application.mk
          grep -q "abiFilters 'arm64-v8a'" build.gradle

      - name: Prepare minimal playable EDOPro data
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          A=src/main/assets/defaults
          mkdir -p "$A/config" "$A/fonts" "$A/textures" "$A/pics" "$A/deck"
          # Package PrimaNyx skin for fresh installs and app updates.
          SKIN_SOURCE="deps/edopro/skin/PrimaNyx/skin.xml"
          test -s "$SKIN_SOURCE"

          mkdir -p \
            "$A/skin/PrimaNyx" \
            "src/main/assets/update/skin/PrimaNyx"

          cp "$SKIN_SOURCE" "$A/skin/PrimaNyx/skin.xml"
          # Package the checkbox texture referenced by PrimaNyx/skin.xml.
          cp deps/edopro/textures/primanyx-check.png "$A/textures/primanyx-check.png"
          test -s "$A/textures/primanyx-check.png"
          cp "$SKIN_SOURCE" "src/main/assets/update/skin/PrimaNyx/skin.xml"
          test -d deps/edopro/deck
          cp -a deps/edopro/deck/. "$A/deck/"
          test -s "$A/deck/[TEST] Dark Magician.ydk"
          test -s "$A/deck/[TEST] Blue-Eyes.ydk"
          BASE=https://raw.githubusercontent.com/ProjectIgnis/Distribution/master
          curl -fL "$BASE/config/strings.conf" -o "$A/config/strings.conf"
          curl -fL "$BASE/config/system.conf" -o "$A/config/system.conf"
          curl -fL "$BASE/fonts/NotoSansJP-Regular.otf" -o "$A/fonts/NotoSansJP-Regular.otf"
          printf '{"repos":[],"urls":[]}\n' > "$A/config/configs.json"
          printf '{"mappings":[]}\n' > "$A/config/mappings.json"
          for name in cover unknown act attack chain negated number lp lpf mask equip target chaintarget lim ot f1 f2 f3 bg field2 field-transparent2 field3 field-transparent3 field field-transparent field4 field-transparent4 fieldSP2 field-transparentSP2 fieldSP3 field-transparentSP3 fieldSP field-transparentSP fieldSP4 field-transparentSP4 settings; do
            for ext in png jpg; do
              if curl -fsSL "$BASE/textures/$name.$ext" -o "$A/textures/$name.$ext"; then break; fi
            done
            test -s "$A/textures/$name.png" -o -s "$A/textures/$name.jpg"
          done
          # Download the full CDB only as a temporary source; never package it.
          SOURCE_CDB="$RUNNER_TEMP/babel-cards-source.cdb"
          curl -fL https://raw.githubusercontent.com/ProjectIgnis/BabelCDB/master/cards.cdb -o "$SOURCE_CDB"
          test -s "$SOURCE_CDB"
          python3 deps/edopro/tools/prepare-dark-test-cards.py "$SOURCE_CDB" "$A"
          test "$(wc -l < "$A/dark-test-cards.txt")" -eq 41
          test "$(find "$A/pics" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 40
          test -s "$A/cards.cdb"
          test ! -e "$A/babel-cards-source.cdb"
          rm -f "$SOURCE_CDB"
          du -sh "$A"

