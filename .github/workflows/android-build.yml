name: AetherDuel Android APK (Startup-ready)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherduel-android-startup-ready-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout clean AetherDuel source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          path: aetherduel-source

      - name: Checkout pinned Android wrapper and submodules
        uses: actions/checkout@v5
        with:
          repository: edo9300/edopro-android
          ref: 36517642ce8151d9e6e5fb1acb801dfa7a8ef1f5
          path: android-wrapper
          submodules: recursive

      - name: Overlay clean AetherDuel source into Android wrapper
        run: |
          set -euo pipefail
          test -d android-wrapper/deps/edopro/ocgcore
          rsync -a --delete \
            --exclude='.git' \
            --exclude='ocgcore/' \
            --exclude='.github/' \
            "aetherduel-source/" android-wrapper/deps/edopro/
          test -f android-wrapper/deps/edopro/gframe/game.cpp
          echo "AetherDuel source revision: $GITHUB_SHA"
          echo "AetherDuel source revision staged for Android build."

      - name: Remove legacy Android maximum aspect ratio cap
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("src/main/AndroidManifest.xml")
          text = manifest.read_text()
          pattern = r'\s*<meta-data\s+android:name="android\.max_aspect"\s+android:value="2\.1"\s*/>'
          updated, count = re.subn(pattern, "", text, count=1)
          assert count == 1, "Expected exactly one legacy android.max_aspect=2.1 entry"
          assert "android.max_aspect" not in updated, "Legacy aspect-ratio cap remains"
          manifest.write_text(updated)
          print("Removed legacy 2.1 maximum aspect ratio cap.")
          PY
          ! grep -q 'android.max_aspect' src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Apply WindBot-free diagnostic isolation
        working-directory: android-wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          gradle = Path("build.gradle")
          text = gradle.read_text()
          dependency = '\timplementation(files("libs/libWindbot.aar"))\n'
          assert text.count(dependency) == 1, "Expected exactly one WindBot AAR dependency"
          gradle.write_text(text.replace(dependency, ""))

          main = Path("src/main/java/io.github.edo9300.edopro/MainActivity.java")
          text = main.read_text()
          text = text.replace("import libwindbot.windbot.WindBot;\n", "")
          old = """\t\tvar use_windbot = true;
          \t\tif (Build.VERSION.SDK_INT <= Build.VERSION_CODES.ICE_CREAM_SANDWICH_MR1) {
          \t\t\tuse_windbot = false;
          \t\t} else {
          \t\t\ttry {
          \t\t\t\t/*
          \t\t\t\t * windbot loading might fail, for whatever reason,
          \t\t\t\t * disable it if that's the case
          \t\t\t\t */
          \t\t\t\tWindBot.initAndroid(working_directory + "/WindBot");
          \t\t\t} catch (Exception e) {
          \t\t\t\tuse_windbot = false;
          \t\t\t}
          \t\t}
          """
          assert text.count(old) == 1, "Could not uniquely locate WindBot initialization"
          text = text.replace(old, "\t\tvar use_windbot = false;\n")
          assert "WindBot" not in text, "Unexpected WindBot reference remains in MainActivity"
          main.write_text(text)

          native = Path("src/main/java/io.github.edo9300.edopro/EpNativeActivity.java")
          text = native.read_text()
          fullscreen_pattern = (
              r'\t@SuppressWarnings\("ObsoleteSdkInt"\)\n'
              r'\tprivate void makeFullScreen\(\) \{.*?\n\t\}'
          )
          fullscreen_replacement = """\t@SuppressWarnings("ObsoleteSdkInt")
          \tprivate void makeFullScreen() {
          \t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
          \t\t\tandroid.view.WindowInsetsController controller = getWindow().getInsetsController();
          \t\t\tif (controller != null) {
          \t\t\t\tcontroller.setSystemBarsBehavior(
          \t\t\t\t\t\tandroid.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
          \t\t\t\tcontroller.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t}
          \t\t} else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
          \t\t\tgetWindow().getDecorView().setSystemUiVisibility(
          \t\t\t\t\tandroid.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
          \t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
          \t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
          \t\t}
          \t}
          """
          text, fullscreen_count = re.subn(
              fullscreen_pattern, fullscreen_replacement, text, count=1, flags=re.S
          )
          assert fullscreen_count == 1, "Could not replace legacy fullscreen method"
          text = text.replace("import libwindbot.windbot.WindBot;\n", "")
          for action, method in [
              ("RUN_WINDBOT", "runAndroid"),
              ("ATTACH_WINDBOT_DATABASE", "addDatabase"),
          ]:
              pattern = (
                  r'\n\t\t\t\tcase "' + action + r'": \{.*?'
                  + re.escape("WindBot." + method) + r'\(args\);'
                  + r'.*?\n\t\t\t\t\}'
              )
              text, count = re.subn(pattern, "", text, count=1, flags=re.S)
              assert count == 1, "Could not remove " + action + " receiver"
          assert "WindBot." not in text, "WindBot runtime call remains in EpNativeActivity"
          declaration = "\tpublic static native void putBackKeyEvent();\n"
          anchor = "\tpublic static native void errorDialogReturn();\n"
          assert text.count(anchor) == 1, "Could not locate native callback declarations"
          assert "putBackKeyEvent" not in text, "Back callback already exists"
          text = text.replace(anchor, anchor + declaration)
          input_mode_java = """
          \tprivate int deckNamePreviousSystemUiVisibility = -1;
          private boolean deckNameInputModeActive = false;

          \tpublic void setDeckNameInputMode(boolean active) {
          \t\trunOnUiThread(() -> {
          \t\t\tandroid.view.View decor = getWindow().getDecorView();
          \t\t\tdeckNameInputModeActive = active;
          \t\t\tif (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
          \t\t\t\tandroid.view.WindowInsetsController controller = getWindow().getInsetsController();
          \t\t\t\tif (controller != null) {
          \t\t\t\t\tcontroller.setSystemBarsBehavior(
          \t\t\t\t\t\t\tandroid.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
          \t\t\t\t\tcontroller.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t\t}
          \t\t\t\t// Reapply after the IME request so its inset transition cannot leave
          \t\t\t\t// the navigation bar visible beside the split keyboard.
          \t\t\t\tif (active) {
          \t\t\t\t\tdecor.post(() -> {
          \t\t\t\t\t\tif (deckNameInputModeActive) {
          \t\t\t\t\t\t\tandroid.view.WindowInsetsController current = getWindow().getInsetsController();
          \t\t\t\t\t\t\tif (current != null)
          \t\t\t\t\t\t\t\tcurrent.hide(android.view.WindowInsets.Type.navigationBars());
          \t\t\t\t\t\t}
          \t\t\t\t\t});
          \t\t\t\t}
          \t\t\t} else if (active) {
          \t\t\t\tif (deckNamePreviousSystemUiVisibility < 0)
          \t\t\t\t\tdeckNamePreviousSystemUiVisibility = decor.getSystemUiVisibility();
          \t\t\t\tdecor.setSystemUiVisibility(
          \t\t\t\t\t\tdeckNamePreviousSystemUiVisibility
          \t\t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
          \t\t\t\t\t\t\t| android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
          \t\t\t} else if (deckNamePreviousSystemUiVisibility >= 0) {
          \t\t\t\tdecor.setSystemUiVisibility(deckNamePreviousSystemUiVisibility);
          \t\t\t\tdeckNamePreviousSystemUiVisibility = -1;
          \t\t\t}
          \t\t});
          \t}
          """

          old_back = """\t@Override
          \tpublic boolean onKeyDown(int keyCode, KeyEvent event) {
          \t\tif (keyCode == KeyEvent.KEYCODE_BACK) {
          \t\t\tif ((event.getSource() & InputDevice.SOURCE_MOUSE) != InputDevice.SOURCE_MOUSE)
          \t\t\t\treturn true;
          \t\t}
          \t\treturn super.onKeyDown(keyCode, event);
          \t}
          """
          new_back = """\t@Override
          \tpublic boolean onKeyDown(int keyCode, KeyEvent event) {
          \t\tif (keyCode == KeyEvent.KEYCODE_BACK &&
          \t\t\t\t(event.getSource() & InputDevice.SOURCE_MOUSE) != InputDevice.SOURCE_MOUSE) {
          \t\t\tputBackKeyEvent();
          \t\t\treturn true;
          \t\t}
          \t\treturn super.onKeyDown(keyCode, event);
          \t}

          \t@Override
          \tpublic void onBackPressed() {
          \t\tputBackKeyEvent();
          \t}
          """
          assert text.count(old_back) == 1, "Could not uniquely locate Android Back handler"
          text = text.replace(old_back, input_mode_java + "\n" + new_back)

          oncreate_anchor = "\t\tsuper.onCreate(savedInstanceState);\n"
          assert text.count(oncreate_anchor) == 1, "Could not locate Activity onCreate"
          oncreate_back = (
              oncreate_anchor
              + "\t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {\n"
              + "\t\t\tgetOnBackInvokedDispatcher().registerOnBackInvokedCallback(\n"
              + "\t\t\t\t\tandroid.window.OnBackInvokedDispatcher.PRIORITY_OVERLAY,\n"
              + "\t\t\t\t\t() -> putBackKeyEvent());\n"
              + "\t\t}\n"
          )
          text = text.replace(oncreate_anchor, oncreate_back)
          old_show_combo = """
          	@SuppressWarnings({"unused", "deprecation"})
          	public void showComboBox(String[] parameters) {
          		var intent = new Intent();
          		intent.putExtra("args", parameters);
          		intent.setAction("MAKE_CHOICE");
          		LocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          	}"""
          new_show_combo = """
          	@SuppressWarnings({"unused", "deprecation"})
          	public void showComboBox(String[] parameters, int panelColor, int itemColor,
          								 int borderColor, int textColor) {
          		var intent = new Intent();
          		intent.putExtra("args", parameters);
          		intent.putExtra("panelColor", panelColor);
          		intent.putExtra("itemColor", itemColor);
          		intent.putExtra("borderColor", borderColor);
          		intent.putExtra("textColor", textColor);
          		intent.setAction("MAKE_CHOICE");
          		LocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          	}"""
          assert text.count(old_show_combo) == 1, "Could not locate showComboBox method"
          text = text.replace(old_show_combo, new_show_combo)
          old_show_dialog = """
          \tpublic void showDialog(String current) {
          \t\tvar intent = new Intent();
          \t\tintent.putExtra("current", current);
          \t\tintent.setAction("INPUT_TEXT");
          \t\tLocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          \t}"""
          new_show_dialog = """
          	public void showDialog(String current, boolean deckNameInput, int panelColor,
          								int previewColor, int keyColor, int borderColor,
          								int textColor, int caretColor, int inputTextColor,
           				int letterTextColor) {
          		var intent = new Intent();
          		intent.putExtra("current", current);
          		intent.putExtra("deckNameInput", deckNameInput);
          		intent.putExtra("panelColor", panelColor);
          		intent.putExtra("previewColor", previewColor);
          		intent.putExtra("keyColor", keyColor);
          		intent.putExtra("borderColor", borderColor);
          		intent.putExtra("textColor", textColor);
          		intent.putExtra("caretColor", caretColor);
           		intent.putExtra("inputTextColor", inputTextColor);
           		intent.putExtra("letterTextColor", letterTextColor);
          		intent.setAction("INPUT_TEXT");
          		LocalBroadcastManager.getInstance(this).sendBroadcast(intent);
          	}"""
          assert text.count(old_show_dialog) == 1, "Could not locate showDialog method"
          text = text.replace(old_show_dialog, new_show_dialog)
          old_text_entry_receiver = "new TextEntry().Show(EpNativeActivity.this, intent.getStringExtra(\"current\"));"
          new_text_entry_receiver = """new TextEntry().Show(EpNativeActivity.this, intent.getStringExtra("current"),
          							intent.getBooleanExtra("deckNameInput", false),
          							intent.getIntExtra("panelColor", android.graphics.Color.rgb(24, 27, 34)),
          							intent.getIntExtra("previewColor", android.graphics.Color.rgb(38, 43, 52)),
          							intent.getIntExtra("keyColor", android.graphics.Color.rgb(54, 59, 69)),
          							intent.getIntExtra("borderColor", android.graphics.Color.rgb(75, 82, 94)),
          							intent.getIntExtra("textColor", android.graphics.Color.WHITE),
          							intent.getIntExtra("caretColor", android.graphics.Color.WHITE),
           							intent.getIntExtra("inputTextColor", android.graphics.Color.WHITE),
           							intent.getIntExtra("letterTextColor", android.graphics.Color.WHITE));"""
          assert text.count(old_text_entry_receiver) == 1, "Could not locate TextEntry receiver"
          text = text.replace(old_text_entry_receiver, new_text_entry_receiver)
          # Carry the explicit native category marker into the MAKE_CHOICE receiver.
          choice_receiver_anchor = """				case "MAKE_CHOICE": {
          					final var parameters = intent.getStringArrayExtra("args");
          					new AlertDialog.Builder(EpNativeActivity.this)"""
          choice_receiver_replacement = """				case "MAKE_CHOICE": {
          					final var parameters = intent.getStringArrayExtra("args");
          					new AlertDialog.Builder(EpNativeActivity.this)"""
          assert text.count(choice_receiver_anchor) == 1, "Could not locate MAKE_CHOICE receiver"
          text = text.replace(choice_receiver_anchor, choice_receiver_replacement)

          # Apply the shared PrimaNyx treatment to every native combo dropdown.
          choice_pattern = (
              r'new AlertDialog\.Builder\(EpNativeActivity\.this\)\s*'
              r'(?://\.setCancelable\(false\)\s*)?'
              r'\.setItems\(parameters,\s*\(dialog,\s*id\)\s*->\s*putComboBoxResult\(id\)\)\s*'
              r'\.show\(\);'
          )
          choice_replacement = """final int panelColor = intent.getIntExtra("panelColor", android.graphics.Color.rgb(35, 41, 51));
          final int itemColor = intent.getIntExtra("itemColor", android.graphics.Color.rgb(38, 43, 52));
          final int borderColor = intent.getIntExtra("borderColor", android.graphics.Color.rgb(82, 91, 106));
          final int textColor = intent.getIntExtra("textColor", android.graphics.Color.WHITE);
          if (parameters != null && parameters.length > 0) {
              final float density = getResources().getDisplayMetrics().density;
              final int panelWidth = Math.min(
                      Math.round(getResources().getDisplayMetrics().widthPixels * 0.55f),
                      Math.round(390 * density));
              final int itemHeight = Math.round(42 * density);
              final int itemGap = Math.round(8 * density);
              final int panelPadding = Math.round(9 * density);
              final int contentHeight = panelPadding * 2
                      + parameters.length * itemHeight
                      + Math.max(0, parameters.length - 1) * itemGap;
              final int maxDialogHeight = Math.round(
                      getResources().getDisplayMetrics().heightPixels * 0.65f);

              android.widget.FrameLayout dialogRoot =
                      new android.widget.FrameLayout(EpNativeActivity.this);
              android.widget.LinearLayout dropdownPanel =
                      new android.widget.LinearLayout(EpNativeActivity.this);
              dropdownPanel.setOrientation(android.widget.LinearLayout.VERTICAL);
              dropdownPanel.setPadding(panelPadding, panelPadding, panelPadding, panelPadding);

              android.graphics.drawable.GradientDrawable panelBackground =
                      new android.graphics.drawable.GradientDrawable();
              panelBackground.setColor(panelColor);
              panelBackground.setCornerRadius(14 * density);
              panelBackground.setStroke(Math.max(1, Math.round(density)),
                      borderColor);
              dropdownPanel.setBackground(panelBackground);
              dropdownPanel.setElevation(12 * density);

              final boolean shouldScroll = parameters.length > 5;
              final int panelHeight = Math.min(contentHeight, maxDialogHeight);

              android.widget.ScrollView dropdownScroll =
                      new android.widget.ScrollView(EpNativeActivity.this);
              dropdownScroll.setFillViewport(false);
              dropdownScroll.setClipToPadding(false);
              dropdownScroll.setVerticalScrollBarEnabled(false);

              android.widget.LinearLayout dropdownContent =
                      new android.widget.LinearLayout(EpNativeActivity.this);
              dropdownContent.setOrientation(android.widget.LinearLayout.VERTICAL);
              dropdownScroll.addView(dropdownContent,
                      new android.widget.ScrollView.LayoutParams(
                              android.widget.ScrollView.LayoutParams.MATCH_PARENT,
                              android.widget.ScrollView.LayoutParams.WRAP_CONTENT));

              android.widget.LinearLayout.LayoutParams scrollParams =
                      new android.widget.LinearLayout.LayoutParams(
                              android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                              shouldScroll ? Math.max(0, panelHeight - panelPadding * 2)
                                      : android.widget.LinearLayout.LayoutParams.WRAP_CONTENT);
              dropdownPanel.addView(dropdownScroll, scrollParams);

              final AlertDialog dropdownDialog =
                      new AlertDialog.Builder(EpNativeActivity.this)
                              .setView(dialogRoot)
                              .create();

              for (int i = 0; i < parameters.length; i++) {
                  final int choiceIndex = i;
                  android.widget.TextView item =
                          new android.widget.TextView(EpNativeActivity.this);
                  item.setText(parameters[i]);
                  item.setTextColor(textColor);
                  item.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 15);
                  item.setGravity(android.view.Gravity.CENTER);

                  android.graphics.drawable.GradientDrawable itemBackground =
                          new android.graphics.drawable.GradientDrawable();
                  itemBackground.setColor(itemColor);
                  itemBackground.setCornerRadius(9 * density);
                  itemBackground.setStroke(Math.max(1, Math.round(density)),
                          borderColor);
                  item.setBackground(itemBackground);

                  android.widget.LinearLayout.LayoutParams itemParams =
                          new android.widget.LinearLayout.LayoutParams(
                                  android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                                  itemHeight);
                  if (i < parameters.length - 1)
                      itemParams.bottomMargin = itemGap;
                  dropdownContent.addView(item, itemParams);
                  item.setOnClickListener(view -> {
                      putComboBoxResult(choiceIndex);
                      dropdownDialog.dismiss();
                  });
              }

              android.widget.FrameLayout.LayoutParams panelParams =
                      new android.widget.FrameLayout.LayoutParams(panelWidth, panelHeight,
                              android.view.Gravity.CENTER);
              dialogRoot.addView(dropdownPanel, panelParams);
              dropdownDialog.show();
              android.view.Window dropdownWindow = dropdownDialog.getWindow();
              if (dropdownWindow != null) {
                  dropdownWindow.setBackgroundDrawable(
                          new android.graphics.drawable.ColorDrawable(
                                  android.graphics.Color.TRANSPARENT));
                  dropdownWindow.setLayout(android.view.WindowManager.LayoutParams.MATCH_PARENT,
                          android.view.WindowManager.LayoutParams.WRAP_CONTENT);
                  dropdownWindow.setGravity(android.view.Gravity.CENTER);
              }
          } else {
              new AlertDialog.Builder(EpNativeActivity.this)
                      .setItems(parameters, (dialog, id) -> putComboBoxResult(id))
                      .show();
          }"""
          text, choice_count = re.subn(choice_pattern, choice_replacement, text, count=1, flags=re.S)
          assert choice_count == 1, "Could not uniquely style the native combo AlertDialog"
          native.write_text(text)

          # Replace the Android IME dialog with AetherDuel's split in-app keyboard.
          textentry = Path("src/main/java/io.github.edo9300.edopro/TextEntry.java")
          java_source = r'''package io.github.edo9300.edopro;

          import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Space;
          import android.text.Editable;
          import android.text.InputType;

          public class TextEntry {
              private AlertDialog mTextInputDialog;
              private Context context;
              private StringBuilder value;
              private EditText preview;
              private LinearLayout keyboardRows;
              private boolean deckNameInput;
              private boolean shifted;
              private boolean symbols;
              private boolean finished;
              private int panelColor;
              private int previewColor;
              private int keyColor;
              private int borderColor;
              private int textColor;
              private int caretColor;
              private int inputTextColor;
              private int letterTextColor;

              public void Show(Context context, String current, boolean deckNameInput,
                               int panelColor, int previewColor, int keyColor,
                               int borderColor, int textColor, int caretColor,
                               int inputTextColor, int letterTextColor) {
                  this.context = context;
                  this.deckNameInput = deckNameInput;
                  this.panelColor = panelColor;
                  this.previewColor = previewColor;
                  this.keyColor = keyColor;
                  this.borderColor = borderColor;
                  this.textColor = textColor;
                  this.caretColor = caretColor;
                  this.inputTextColor = inputTextColor;
                  this.letterTextColor = letterTextColor;
                  this.value = new StringBuilder(current == null ? "" : current);
                  this.shifted = false;
                  this.symbols = false;
                  this.finished = false;

                  LinearLayout root = new LinearLayout(context);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(8), dp(8), dp(8), dp(10));
                  GradientDrawable panel = new GradientDrawable();
                  panel.setColor(panelColor);
                  panel.setCornerRadius(dp(12));
                  root.setBackground(panel);

                  preview = new EditText(context);
                  preview.setTextColor(inputTextColor);
                  preview.setTextSize(16);
                  preview.setSingleLine(true);
                  preview.setHorizontallyScrolling(true);
                  preview.setGravity(Gravity.CENTER);
                  preview.setPadding(dp(12), 0, dp(12), 0);
                  preview.setBackground(makeKeyBackground(false));
                  preview.setInputType(InputType.TYPE_CLASS_TEXT
                          | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  preview.setShowSoftInputOnFocus(false);
                  preview.setCursorVisible(true);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                      android.graphics.drawable.Drawable cursor = preview.getTextCursorDrawable();
                      if (cursor != null)
                          cursor.setTint(caretColor);
                  }
                  preview.setFocusable(true);
                  preview.setFocusableInTouchMode(true);
                  LinearLayout.LayoutParams previewParams =
                          new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(38));
                  previewParams.setMargins(dp(2), dp(2), dp(2), dp(7));
                  root.addView(preview, previewParams);

                  keyboardRows = new LinearLayout(context);
                  keyboardRows.setOrientation(LinearLayout.VERTICAL);
                  root.addView(keyboardRows, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  updatePreview();
                  rebuildKeyboard();

                  mTextInputDialog = new AlertDialog.Builder(context).setView(root).create();
                  mTextInputDialog.setCanceledOnTouchOutside(false);
                  mTextInputDialog.setOnCancelListener(dialog -> cancelInput());
                  mTextInputDialog.show();
                  preview.requestFocus();
                  preview.setSelection(preview.length());

                  Window window = mTextInputDialog.getWindow();
                  if (window != null) {
                      window.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      window.setLayout(WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.WRAP_CONTENT);
                      window.setGravity(Gravity.BOTTOM);
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      applyImmersiveNavigation(window);
                  }
              }

              private void rebuildKeyboard() {
                  keyboardRows.removeAllViews();
                  if (!symbols) {
                      addSplitRow(new String[]{"q", "w", "e", "r", "t"},
                              new String[]{"y", "u", "i", "o", "p"});
                      addSplitRow(new String[]{"a", "s", "d", "f", "g"},
                              new String[]{"h", "j", "k", "l"});
                      addSplitRow(new String[]{"SHIFT", "z", "x", "c", "v"},
                              new String[]{"b", "n", "m", "⌫"});
                  } else {
                      addSplitRow(new String[]{"1", "2", "3", "4", "5"},
                              new String[]{"6", "7", "8", "9", "0"});
                      addSplitRow(new String[]{"@", "#", "$", "%", "&"},
                              new String[]{"-", "+", "(", ")", "/"});
                      addSplitRow(new String[]{"=", "*", "'", "\"", ":"},
                              new String[]{";", "!", "?", "⌫"});
                  }
                  addSplitRow(new String[]{"?123", ",", "SPACE"},
                          new String[]{".", "CANCEL", "DONE"});
              }

              private void addSplitRow(String[] leftKeys, String[] rightKeys) {
                  LinearLayout row = new LinearLayout(context);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout left = new LinearLayout(context);
                  left.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout right = new LinearLayout(context);
                  right.setOrientation(LinearLayout.HORIZONTAL);

                  row.addView(left, new LinearLayout.LayoutParams(0, dp(45), 1f));
                  row.addView(new Space(context), new LinearLayout.LayoutParams(dp(62), dp(45)));
                  row.addView(right, new LinearLayout.LayoutParams(0, dp(45), 1f));

                  for (String key : leftKeys)
                      addKey(left, key);
                  for (String key : rightKeys)
                      addKey(right, key);

                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(45));
                  rowParams.setMargins(0, dp(2), 0, dp(2));
                  keyboardRows.addView(row, rowParams);
              }

              private void addKey(LinearLayout group, String key) {
                  Button button = new Button(context);
                  button.setText(getKeyLabel(key));
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(key.length() > 1 ? 11 : 15);
                  button.setAllCaps(false);
                  button.setMinWidth(0);
                  button.setMinimumWidth(0);
                  button.setPadding(dp(2), 0, dp(2), 0);
                  button.setBackground(makeKeyBackground(true));
                  button.setOnClickListener(view -> handleKey(key));

                  float weight = "SPACE".equals(key) ? 2f : 1f;
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          bridgesGap ? dp(CENTER_GAP) : 0,
                          LinearLayout.LayoutParams.MATCH_PARENT, weight);
                  params.setMargins(dp(2), 0, dp(2), 0);
                  group.addView(button, params);
              }

              private String getKeyLabel(String key) {
                  if ("SHIFT".equals(key))
                      return "Shift";
                  if ("SPACE".equals(key))
                      return "Space";
                  if ("?123".equals(key))
                      return symbols ? "ABC" : "?123";
                  if ("CANCEL".equals(key))
                      return "Cancel";
                  if ("DONE".equals(key))
                      return "Enter";
                  if ("⌫".equals(key))
                      return "⌫";
                  if (key.length() == 1 && Character.isLetter(key.charAt(0)))
                      return shifted ? key.toUpperCase() : key;
                  return key;
              }

              private void handleKey(String key) {
                  if (finished)
                      return;
                  if ("DONE".equals(key)) {
                      pushResult(value.toString(), true);
                  } else if ("CANCEL".equals(key)) {
                      cancelInput();
                  } else if ("SHIFT".equals(key)) {
                      shifted = !shifted;
                      rebuildKeyboard();
                  } else if ("?123".equals(key)) {
                      symbols = !symbols;
                      rebuildKeyboard();
                  } else if ("SPACE".equals(key)) {
                      insertText(" ");
                  } else if ("⌫".equals(key)) {
                      deleteBackward();
                  } else {
                      insertText(shifted ? key.toUpperCase() : key);
                      if (shifted) {
                          shifted = false;
                          rebuildKeyboard();
                      }
                  }
              }

              private void insertText(String text) {
                  Editable editable = preview.getText();
                  int start = preview.getSelectionStart();
                  int end = preview.getSelectionEnd();
                  if (start < 0 || end < 0)
                      start = end = editable.length();
                  if (start > end) {
                      int swap = start;
                      start = end;
                      end = swap;
                  }
                  editable.replace(start, end, text);
                  preview.setSelection(start + text.length());
                  value.setLength(0);
                  value.append(editable);
              }

              private void deleteBackward() {
                  Editable editable = preview.getText();
                  int start = preview.getSelectionStart();
                  int end = preview.getSelectionEnd();
                  if (start < 0 || end < 0)
                      start = end = editable.length();
                  if (start > end) {
                      int swap = start;
                      start = end;
                      end = swap;
                  }
                  if (start != end) {
                      editable.delete(start, end);
                  } else if (start > 0) {
                      int previous = Character.offsetByCodePoints(editable, start, -1);
                      editable.delete(previous, start);
                      start = previous;
                  }
                  preview.setSelection(start);
                  value.setLength(0);
                  value.append(editable);
              }

              private void updatePreview() {
                  preview.setText(value.toString());
                  preview.setSelection(preview.length());
              }

              private void pushResult(String text, boolean sendEnter) {
                  if (finished)
                      return;
                  finished = true;
                  EpNativeActivity.putMessageBoxResult(text, sendEnter);
                  if (mTextInputDialog != null)
                      mTextInputDialog.dismiss();
              }

              private void cancelInput() {
                  if (finished)
                      return;
                  finished = true;
                  if (deckNameInput) {
                      EpNativeActivity.putBackKeyEvent();
                  } else {
                      EpNativeActivity.putMessageBoxResult(value.toString(), false);
                  }
                  if (mTextInputDialog != null)
                      mTextInputDialog.dismiss();
              }

              private GradientDrawable makeKeyBackground(boolean key) {
