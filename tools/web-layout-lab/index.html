<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <title>AetherDuel · Card Layout Lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { height: 100vh; height: 100dvh; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: #17191d;
      color: #e8eaf0;
      font: 14px/1.4 system-ui, sans-serif;
    }
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px 12px;
      flex-wrap: wrap;
      min-height: 48px;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: #22252b;
      border-bottom: 1px solid #3b3f48;
    }
    header strong { font-size: 13px; }
    header span { color: #aeb4c0; font-size: 11px; }
    label {
      margin-left: auto;
      padding: 6px 9px;
      border: 1px solid #555c68;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }
    input { display: none; }
    main {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #status {
      position: absolute;
      right: 8px;
      bottom: 8px;
      max-width: calc(100% - 16px);
      padding: 4px 6px;
      border-radius: 4px;
      background: #17191dcc;
      color: #aeb4c0;
      font-size: 10px;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      header { gap: 6px 8px; padding-inline: 9px; }
      header span { flex-basis: 100%; order: 3; }
      label { margin-left: auto; }
    }
  </style>
</head>
<body>
  <header>
    <strong>AetherDuel · Card Layout Lab</strong>
    <span>Fullscreen card geometry · shared JSON specification</span>
    <label for="artwork">Load card artwork</label>
    <input id="artwork" type="file" accept="image/*">
  </header>
  <main>
    <canvas id="preview" aria-label="Fullscreen card layout preview"></canvas>
    <div id="status">Loading layout specification…</div>
  </main>
  <script type="module">
    const canvas = document.querySelector("#preview");
    const ctx = canvas.getContext("2d");
    const status = document.querySelector("#status");
    const fileInput = document.querySelector("#artwork");

    let spec;
    let artwork = null;
    let artworkUrl = null;

    async function loadSpec() {
      const response = await fetch("./layout-spec/card-view.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`Could not load layout spec (${response.status})`);
      spec = await response.json();
      if (spec.schema_version !== 1) throw new Error("Unsupported layout schema");
      draw();
    }

    function draw() {
      if (!spec) return;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = "#17191d";
      ctx.fillRect(0, 0, width, height);

      const layout = spec.fullscreen;
      const ratioWidth = layout.artwork_aspect_ratio.width;
      const ratioHeight = layout.artwork_aspect_ratio.height;

      // Browser preview only: contain the complete native-ratio card in the
      // available Chrome viewport. The native C++ geometry remains unchanged.
      const scale = Math.min(width / ratioWidth, height / ratioHeight);
      const cardWidth = ratioWidth * scale;
      const cardHeight = ratioHeight * scale;
      const x = (width - cardWidth) / 2;
      const y = (height - cardHeight) / 2;

      ctx.fillStyle = "#30343b";
      ctx.fillRect(x, y, cardWidth, cardHeight);

      if (artwork) {
        ctx.drawImage(artwork, x, y, cardWidth, cardHeight);
      } else {
        ctx.strokeStyle = "#68717f";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cardWidth - 1, cardHeight - 1);
        ctx.fillStyle = "#d7dce5";
        ctx.textAlign = "center";
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText("Load card artwork", x + cardWidth / 2, y + cardHeight / 2);
      }

      status.textContent =
        `Chrome viewport ${Math.round(width)}×${Math.round(height)} · Card ${Math.round(cardWidth)}×${Math.round(cardHeight)} · ratio ${ratioWidth}:${ratioHeight} · fit: contain`;
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      if (artworkUrl) URL.revokeObjectURL(artworkUrl);
      artworkUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        artwork = image;
        draw();
      };
      image.onerror = () => { status.textContent = "Could not read selected image."; };
      image.src = artworkUrl;
    });

    const resizeObserver = new ResizeObserver(draw);
    resizeObserver.observe(canvas.parentElement);
    window.visualViewport?.addEventListener("resize", draw);
    window.addEventListener("orientationchange", draw);
    loadSpec().catch(error => {
      status.textContent = error.message;
      console.error(error);
    });
  </script>
</body>
</html>
