<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17191d"><title>PrimaNyx · Keyboard Layout Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17191d;color:#e8eaf0;font:14px/1.4 system-ui,sans-serif}body{padding-bottom:18px}
header{padding:10px 12px;background:#22252b;border-bottom:1px solid #3b3f48}header strong{display:block}header span{font-size:11px;color:#aeb4c0}
.toolbar,.fields{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 10px;background:#202329;border-bottom:1px solid #383d46}.fields{background:#1c1f24}.control{display:flex;align-items:center;gap:5px;color:#cbd0da;font-size:11px}
input[type=number],button,select{min-height:31px;border:1px solid #555d69;border-radius:5px;background:#2a2f37;color:#f1f3f7;padding:4px 7px;font:inherit;font-size:12px}input[type=number]{width:60px}button{cursor:pointer}.group-title{font-size:10px;color:#8993a2;text-transform:uppercase;letter-spacing:.06em}
main{padding:12px 0}.stage{width:100%;padding:0}.stage-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;padding:0 10px;color:#aeb4c0;font-size:10px}
.keyboard{position:relative;display:grid;width:100%;grid-template-columns:repeat(24,minmax(0,1fr));grid-auto-rows:var(--row-height);column-gap:0;row-gap:var(--row-gap);padding:var(--pt) var(--pr) var(--pb) var(--pl);border-radius:var(--panel-radius);background-color:var(--panel-color);background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);background-size:calc((100% - var(--pl) - var(--pr))/24) calc(var(--row-height) + var(--row-gap));background-position:var(--pl) var(--pt)}
.key{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;margin:0 var(--key-margin);border:1px solid var(--key-stroke);border-radius:var(--key-radius);background:var(--key-color);color:var(--key-text);font-size:var(--letter-size);font-weight:500;overflow:visible;touch-action:none;user-select:none;cursor:grab}
.key.action{font-size:var(--action-size)}.key.special{background:#414957}.key.selected{outline:2px solid #f1c75b;outline-offset:1px;z-index:3}.resize-handle{position:absolute;width:12px;height:12px;right:-3px;bottom:-3px;border:1px solid #17191d;border-radius:3px;background:#f1c75b;touch-action:none;cursor:nwse-resize}
.status{padding:8px 10px;color:#aeb4c0;font-size:11px;white-space:pre-wrap}.editor{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:10px;background:#242830;border-top:1px solid #3b414b}.editor .control{display:flex;flex-direction:column;align-items:flex-start}.editor input{width:68px}.editor .selected-name{min-width:110px;color:#f1c75b;font-weight:600}
@media(max-width:480px){header{padding:9px}.toolbar,.fields{gap:6px;padding:8px}.control{font-size:10px}main{padding:9px 0}.editor{gap:6px;padding:8px}.editor input{width:58px}}
</style></head>
<body>
<header><strong>PrimaNyx · Keyboard Layout Lab</strong><span>Grid editor · 24 columns × 4 rows · snap enabled · Android dp</span></header>
<section class="toolbar">
<label class="control">Layout <select id="layout"><option value="letters">Letters</option><option value="symbols">Symbols</option></select></label>
<label class="control">Snap <select id="snap"><option value="1">1 cell</option><option value="2">2 cells</option><option value="3">3 cells</option></select></label>
<button id="reset">Reset</button><button id="copy">Copy JSON</button>
</section>
<section class="fields">
<span class="group-title">Panel geometry · dp</span>
<label class="control">Side <input id="panelSide" type="number" min="0"></label><label class="control">Top <input id="panelTop" type="number" min="0"></label><label class="control">Bottom <input id="panelBottom" type="number" min="0"></label>
<label class="control">Row height <input id="rowHeight" type="number" min="1"></label><label class="control">Row gap <input id="rowGap" type="number" min="0"></label><label class="control">Key margin <input id="keyMargin" type="number" min="0"></label>
</section>
<section class="fields"><span class="group-title">Palette</span>
<label class="control">Panel <input id="panelColor" type="color"></label><label class="control">Key <input id="keyColor" type="color"></label><label class="control">Text <input id="textColor" type="color"></label>
</section>
<main><div class="stage"><div class="stage-label"><span>ANDROID KEYBOARD · DRAG TO MOVE · CORNER HANDLE TO RESIZE</span><span id="viewport">24 × 4 GRID</span></div><div id="keyboard" class="keyboard"></div></div></main>
<section class="editor">
<div class="selected-name" id="selectedName">Select a key</div>
<label class="control">Column X <input id="keyX" type="number" min="0" max="23"></label><label class="control">Row Y <input id="keyY" type="number" min="0" max="3"></label><label class="control">Width <input id="keyW" type="number" min="1" max="24"></label>
<button id="applyKey">Apply</button>
</section>
<div id="status" class="status">Loading shared keyboard specification…</div>
<script>
const $=s=>document.querySelector(s),status=$('#status'),keyboard=$('#keyboard');let spec,initial,selected=null,drag=null;
const labelFor=k=>({'SPACE':'Space','SHIFT':'⇧','DONE':'Enter','CANCEL':'Cancel','?123':$('#layout').value==='symbols'?'ABC':'?123'})[k]||k;
function css(){const p=spec.panel,k=spec.keys;const vars={'--pl':p.padding.left+'px','--pr':p.padding.right+'px','--pt':p.padding.top+'px','--pb':p.padding.bottom+'px','--panel-radius':p.radius+'px','--panel-color':p.color,'--row-height':k.rowHeight+'px','--row-gap':spec.grid.rowGap+'px','--key-margin':spec.grid.keyMargin+'px','--key-radius':k.radius+'px','--key-color':k.color,'--key-stroke':k.stroke,'--key-text':k.textColor,'--letter-size':k.letterTextSize+'px','--action-size':k.actionTextSize+'px'};Object.entries(vars).forEach(([a,b])=>keyboard.style.setProperty(a,b));}
function getButtons(){return spec.buttons[$('#layout').value]}
function selectKey(key){selected=key;syncEditor();render()}
function syncEditor(){const b=selected&&getButtons()[selected];$('#selectedName').textContent=b?selected:'Select a key';['X','Y','W'].forEach((v,i)=>$('#key'+v).value=b?[b.x,b.y,b.w][i]: '');}
function render(){if(!spec)return;css();keyboard.innerHTML='';const buttons=getButtons();Object.entries(buttons).forEach(([key,b])=>{const el=document.createElement('div');el.className='key'+(key.length>1?' action':'')+(['SHIFT','?123','CANCEL','DONE','⌫'].includes(key)?' special':'')+(selected===key?' selected':'');el.textContent=labelFor(key);el.style.gridColumn=(b.x+1)+' / span '+b.w;el.style.gridRow=(b.y+1)+' / span '+b.h;el.dataset.key=key;el.addEventListener('pointerdown',onPointerDown);const handle=document.createElement('span');handle.className='resize-handle';handle.addEventListener('pointerdown',e=>onResizeDown(e,key));el.append(handle);keyboard.append(el);});}
function snap(v){const n=Number($('#snap').value);return Math.round(v/n)*n}
function collisionFree(key,candidate){return Object.entries(getButtons()).every(([other,b])=>other===key||candidate.x>=b.x+b.w||candidate.x+candidate.w<=b.x||candidate.y>=b.y+b.h||candidate.y+candidate.h<=b.y)}

function onPointerDown(e){if(e.target.classList.contains('resize-handle'))return;const key=e.currentTarget.dataset.key;selectKey(key);const b=getButtons()[key];drag={mode:'move',key,startX:e.clientX,startY:e.clientY,orig:{...b},element:e.currentTarget};e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault()}
function onResizeDown(e,key){e.stopPropagation();const b=getButtons()[key];drag={mode:'resize',key,startX:e.clientX,startY:e.clientY,orig:{...b},element:e.currentTarget.parentElement};e.currentTarget.parentElement.setPointerCapture(e.pointerId);e.preventDefault()}
keyboard.addEventListener('pointermove',e=>{if(!drag)return;const rect=keyboard.getBoundingClientRect(),unit=(rect.width-spec.panel.padding.left-spec.panel.padding.right)/spec.grid.columns,step=Number($('#snap').value);const dx=snap((e.clientX-drag.startX)/unit),dy=snap((e.clientY-drag.startY)/(spec.keys.rowHeight+spec.grid.rowGap));const b=getButtons()[drag.key],o=drag.orig;if(drag.mode==='move'){const next={...o,x:Math.max(0,Math.min(24-o.w,o.x+dx)),y:Math.max(0,Math.min(4-o.h,o.y+dy))};if(collisionFree(drag.key,next)){b.x=next.x;b.y=next.y;}}else{const next={...o,w:Math.max(1,Math.min(24-o.x,o.w+dx))};if(collisionFree(drag.key,next))b.w=next.w;}if(drag.element){drag.element.style.gridColumn=(b.x+1)+' / span '+b.w;drag.element.style.gridRow=(b.y+1)+' / span '+b.h;}syncEditor()});
keyboard.addEventListener('pointerup',()=>{if(drag){drag=null;render()}});keyboard.addEventListener('pointercancel',()=>{if(drag){drag=null;render()}});
$('#applyKey').addEventListener('click',()=>{if(!selected)return;const b=getButtons()[selected],old={...b};b.x=Math.max(0,Math.min(23,Number($('#keyX').value)||0));b.y=Math.max(0,Math.min(3,Number($('#keyY').value)||0));b.w=Math.max(1,Math.min(24-b.x,Number($('#keyW').value)||1));if(!collisionFree(selected,b)){Object.assign(b,old);status.textContent='That placement overlaps another key.';}render();syncEditor()});
function sync(){const p=spec.panel,k=spec.keys;$('#panelSide').value=p.padding.left;$('#panelTop').value=p.padding.top;$('#panelBottom').value=p.padding.bottom;$('#rowHeight').value=k.rowHeight;$('#rowGap').value=spec.grid.rowGap;$('#keyMargin').value=spec.grid.keyMargin;$('#panelColor').value=p.color;$('#keyColor').value=k.color;$('#textColor').value=k.textColor;render();syncEditor()}
[['panelSide',v=>{spec.panel.padding.left=v;spec.panel.padding.right=v}],['panelTop',v=>spec.panel.padding.top=v],['panelBottom',v=>spec.panel.padding.bottom=v],['rowHeight',v=>spec.keys.rowHeight=v],['rowGap',v=>spec.grid.rowGap=v],['keyMargin',v=>spec.grid.keyMargin=v]].forEach(([id,set])=>$('#'+id).addEventListener('change',e=>{set(Math.max(0,Number(e.target.value)||0));render()}));
[['panelColor',v=>spec.panel.color=v],['keyColor',v=>spec.keys.color=v],['textColor',v=>spec.keys.textColor=v]].forEach(([id,set])=>$('#'+id).addEventListener('input',e=>{set(e.target.value);render()}));
$('#layout').addEventListener('change',()=>{selected=null;render();syncEditor()});$('#reset').addEventListener('click',()=>{spec=JSON.parse(JSON.stringify(initial));selected=null;sync()});
$('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(spec,null,2));status.textContent='JSON copied. Commit layout-spec/keyboard.json to apply the new key positions and widths to Android.'}catch{status.textContent='Clipboard unavailable in this browser.'}});
fetch('./layout-spec/keyboard.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Cannot load keyboard.json ('+r.status+')');return r.json()}).then(d=>{spec=d;initial=JSON.parse(JSON.stringify(d));sync()}).catch(e=>status.textContent=e.message);
</script></body></html>
